services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: evently_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-evently}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-evently}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Django REST API Web Application
  web:
    build: .
    container_name: evently_web
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - USE_SQLITE=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-evently}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - ALLOWED_HOSTS=*
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles

  # 3. Telegram Bot Microservice (aiogram 3.x)
  bot:
    build: .
    container_name: evently_bot
    restart: unless-stopped
    command: python -m bot.main
    env_file:
      - .env
    environment:
      - BACKEND_API_URL=http://web:8000/api/v1
      - USE_SQLITE=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-evently}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      web:
        condition: service_started

  # 4. Periodic Reminder Worker (send_event_reminders)
  reminder-worker:
    build: .
    container_name: evently_reminder_worker
    restart: unless-stopped
    command: python manage.py run_reminder_worker --interval 60
    env_file:
      - .env
    environment:
      - USE_SQLITE=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-evently}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - BACKEND_API_URL=http://web:8000/api/v1
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
  static_volume:
